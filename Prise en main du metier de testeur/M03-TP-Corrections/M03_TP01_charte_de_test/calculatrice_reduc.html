<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice de Réduction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }

        .result.show {
            display: block;
        }

        .result h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .result-item:last-child {
            border-bottom: none;
            font-weight: 600;
            font-size: 18px;
            color: #667eea;
        }

        .error {
            color: #dc3545;
            background: #f8d7da;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Calculatrice de Réduction</h1>
        <p class="subtitle">Calculez vos économies instantanément</p>

        <form id="discountForm">
            <div class="form-group">
                <label for="price">Prix initial (€) *</label>
                <input type="text" id="price" name="price" placeholder="Ex: 100.50">
            </div>

            <div class="form-group">
                <label for="discount">Pourcentage de réduction (%) *</label>
                <input type="text" id="discount" name="discount" placeholder="Ex: 20">
            </div>

            <div class="form-group">
                <label for="quantity">Quantité *</label>
                <input type="text" id="quantity" name="quantity" placeholder="Ex: 3">
            </div>

            <div class="form-group">
                <label for="customerType">Type de client *</label>
                <select id="customerType" name="customerType">
                    <option value="">-- Sélectionnez --</option>
                    <option value="regular">Client régulier</option>
                    <option value="vip">Client VIP</option>
                    <option value="employee">Employé</option>
                </select>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="loyaltyCard" name="loyaltyCard">
                <label for="loyaltyCard">J'ai une carte de fidélité (5% supplémentaire)</label>
            </div>

            <button type="submit">Calculer</button>
        </form>

        <div id="result" class="result">
            <h2>Résultat du calcul</h2>
            <div class="result-item">
                <span>Prix initial total:</span>
                <span id="totalInitial">0.00 €</span>
            </div>
            <div class="result-item">
                <span>Réduction appliquée:</span>
                <span id="discountApplied">0.00 €</span>
            </div>
            <div class="result-item">
                <span>Prix final:</span>
                <span id="finalPrice">0.00 €</span>
            </div>
        </div>

        <div id="error" class="error"></div>
    </div>

    <script>
        document.getElementById('discountForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');

            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');

            const price = document.getElementById('price').value.trim();
            const discount = document.getElementById('discount').value.trim();
            const quantity = document.getElementById('quantity').value.trim();
            const customerType = document.getElementById('customerType').value;
            const loyaltyCard = document.getElementById('loyaltyCard').checked;

            // DÉFAUT 1: Validation incomplète - accepte prix négatif
            if (price === '' || isNaN(price)) {
                showError('Le prix initial doit être un nombre valide.');
                return;
            }

            // DÉFAUT 2: Validation du pourcentage incorrecte - accepte >100
            if (discount === '' || isNaN(discount) || parseFloat(discount) < 0) {
                showError('Le pourcentage de réduction doit être un nombre positif.');
                return;
            }

            // DÉFAUT 3: Pas de validation sur la limite supérieure de quantité
            if (quantity === '' || isNaN(quantity) || parseFloat(quantity) <= 0 || parseFloat(quantity) % 1 !== 0) {
                showError('La quantité doit être un nombre entier positif.');
                return;
            }

            if (customerType === '') {
                showError('Veuillez sélectionner un type de client.');
                return;
            }

            const priceNum = parseFloat(price);
            const discountNum = parseFloat(discount);
            const quantityNum = parseInt(quantity);

            // DÉFAUT 4: Oubli de la réduction VIP additionnelle
            let totalDiscount = discountNum;

            if (customerType === 'employee') {
                totalDiscount += 10;
            }
            // VIP devrait avoir 5% supplémentaire mais c'est oublié

            // DÉFAUT 5: Carte de fidélité appliquée même si réduction >= 50%
            if (loyaltyCard) {
                totalDiscount += 5;
            }

            // DÉFAUT 6: Pas de limite maximale sur la réduction totale
            const totalInitial = priceNum * quantityNum;
            const discountAmount = totalInitial * (totalDiscount / 100);
            let finalPrice = totalInitial - discountAmount;

            // DÉFAUT 7: Valeur limite - erreur d'arrondi pour 0.01
            if (priceNum === 0.01) {
                finalPrice = 0.00;
            }

            // DÉFAUT 8: Bug avec quantité = 100 exactement
            if (quantityNum === 100) {
                finalPrice = finalPrice * 0.95;
            }

            document.getElementById('totalInitial').textContent = totalInitial.toFixed(2) + ' €';
            document.getElementById('discountApplied').textContent = discountAmount.toFixed(2) + ' €';
            document.getElementById('finalPrice').textContent = finalPrice.toFixed(2) + ' €';

            resultDiv.classList.add('show');
        });

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
    </script>
</body>
</html>
